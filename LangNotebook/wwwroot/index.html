<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <meta name="description"
          content="Language Notebook: take notes on vocabulary, sentence patterns, structures, and writing practice. Data is saved locally on your device."/>
    <meta name="theme-color" content="#efede8"/>
    <title>Language Notebook</title>
    <base href="/"/>
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231f2a3a'/><text y='72' x='50' text-anchor='middle' font-size='62' fill='white' font-family='sans-serif'>語</text></svg>"/>
    <script>
        try {
            var t = localStorage.getItem('theme');
            if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap"/>
    <link rel="stylesheet" href="css/tailwind.css"/>
</head>

<body>
<div id="app">
    <div class="boot-screen">
        <div class="spinner"></div>
        <p>Loading Language Notebook…</p>
    </div>
</div>

<div id="blazor-error-ui">
    An unhandled error has occurred.
    <a href="" class="reload">Reload</a>
    <a class="dismiss">🗙</a>
</div>

<script src="js/langdb.js"></script>
<script src="js/theme.js"></script>
<script src="_framework/blazor.webassembly.js" autostart="false"></script>
<script>
    // The UI is English, so load and use the English culture for dates and numbers whatever the
    // browser language is. Setting it here (instead of changing CultureInfo in Program.cs) lets Blazor
    // download the right globalization data before the app starts.
    Blazor.start({ applicationCulture: 'en-US' });
</script>
</body>

</html>
